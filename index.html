<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC 4기 최종 발표 아카이브</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #55554f;
    --ink-faint: #8f8f86;
    --line: #e6e6e0;
    --line-soft: #efefe9;
    --accent: #2f5d50;
    --accent-soft: #e8f0ed;
    --hover: #fbfbf8;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---------- 헤더 ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,247,245,.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 1160px; margin: 0 auto;
    padding: 16px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
  .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .brand p  { font-size: 12.5px; color: var(--ink-faint); }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 16px; min-width: 260px;
  }
  .search-box svg { flex-shrink: 0; color: var(--ink-faint); }
  .search-box input {
    border: none; outline: none; background: transparent;
    font: inherit; font-size: 14px; width: 100%;
  }
  .count-chip {
    font-size: 12.5px; color: var(--ink-soft);
    background: var(--accent-soft); border-radius: 999px; padding: 6px 12px;
    white-space: nowrap;
  }

  /* ---------- 표 ---------- */
  main { max-width: 1160px; margin: 0 auto; padding: 28px 24px 80px; }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 12px; font-weight: 700; letter-spacing: .05em;
    color: var(--ink-faint);
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    background: #fcfcfa;
    white-space: nowrap;
  }
  tbody td {
    padding: 15px 16px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14.5px;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; transition: background .12s ease; }
  tbody tr:hover { background: var(--hover); }

  td.col-no {
    width: 52px; font-size: 13px; font-weight: 600;
    color: var(--ink-faint); font-variant-numeric: tabular-nums;
    padding-top: 17px;
  }
  td.col-name { width: 130px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  td.col-name .sub { display: block; font-size: 12px; font-weight: 400; color: var(--ink-faint); margin-top: 1px; }
  td.col-topic .t { font-weight: 500; }
  td.col-topic .summary {
    display: block; font-size: 13px; color: var(--ink-faint);
    margin-top: 3px; line-height: 1.55;
  }
  td.col-tags { width: 190px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 11.5px; color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px; padding: 2px 9px; white-space: nowrap;
  }
  td.col-links { width: 150px; }
  .mini-link {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; color: var(--ink-soft); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; margin: 0 4px 4px 0;
    transition: border-color .12s, color .12s;
  }
  .mini-link:hover { border-color: var(--accent); color: var(--accent); }

  tr.empty td { color: var(--ink-faint); }
  tr.empty td.col-name { font-weight: 500; }
  .badge-pending {
    font-size: 11.5px; color: var(--ink-faint);
    background: var(--line-soft); border-radius: 999px; padding: 2px 9px;
  }
  .no-result {
    text-align: center; color: var(--ink-faint);
    padding: 70px 0; font-size: 15px; display: none;
  }

  /* ---------- 상세(스토리보드) 뷰 ---------- */
  .detail-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20,20,18,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .detail-overlay.open { opacity: 1; pointer-events: auto; }

  /* 중앙 팝업 래퍼 */
  .detail-modal-wrap {
    position: fixed; inset: 0; z-index: 101;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .detail-modal-wrap.open { opacity: 1; pointer-events: auto; }

  .detail-panel {
    position: relative;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,.28);
    display: flex; flex-direction: row;
    width: min(880px, 100%);
    max-height: calc(100vh - 64px);
    overflow: hidden;
    transform: scale(.96);
    transition: transform .22s cubic-bezier(.32,.72,.28,1), width .28s ease;
  }
  .detail-modal-wrap.open .detail-panel { transform: scale(1); }
  .detail-panel.viewer-open { width: min(1360px, 100%); }

  .detail-main {
    display: flex; flex-direction: column;
    flex: 1 1 0; min-width: 0;
    max-height: calc(100vh - 64px);
  }

  /* 옆에 열리는 뷰어 컬럼 */
  .viewer-col {
    flex: 0 0 0; width: 0;
    border-left: 1px solid var(--line);
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .detail-panel.viewer-open .viewer-col { flex: 0 0 56%; width: 56%; }
  .viewer-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px 13px 20px; border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .viewer-head .vtitle {
    font-size: 12px; font-weight: 700; letter-spacing: .06em;
    color: var(--ink-faint); text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .viewer-head .viewer-newtab {
    margin-left: auto; text-decoration: none; color: var(--ink-soft);
    font-size: 15px; line-height: 1; padding: 4px 6px; border-radius: 8px;
  }
  .viewer-head .viewer-newtab:hover { color: var(--accent); background: var(--line); }
  .viewer-body { flex: 1 1 auto; min-height: 0; background: #525659; }
  .viewer-body object, .viewer-body iframe {
    width: 100%; height: 100%; border: 0; display: block;
  }

  .detail-top {
    padding: 20px 32px 0;
    display: flex; align-items: center; gap: 12px;
  }
  .detail-top .no { font-size: 13px; font-weight: 600; color: var(--ink-faint); }
  .btn-close {
    margin-left: auto;
    border: 1px solid var(--line); background: var(--bg);
    border-radius: 999px; width: 36px; height: 36px;
    font-size: 16px; cursor: pointer; color: var(--ink-soft);
    display: grid; place-items: center;
  }
  .btn-close:hover { background: var(--line); }

  .detail-scroll { overflow-y: auto; flex: 1; }
  .detail-head { padding: 12px 32px 26px; border-bottom: 1px solid var(--line); }
  .detail-head h2 { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; }
  .detail-head .affil { font-size: 13px; color: var(--ink-faint); margin: 2px 0 6px; }
  .detail-head .topic { font-size: 16.5px; color: var(--ink-soft); margin-bottom: 16px; line-height: 1.5; }
  .detail-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .link-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; color: var(--ink-soft);
    background: var(--surface); font-family: inherit; cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .link-pill:hover { border-color: var(--accent); color: var(--accent); }
  .link-pill.active {
    border-color: var(--accent); color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .viewer-head .btn-close { margin-left: 0; width: 30px; height: 30px; font-size: 14px; }

  /* 한눈에 보기 */
  .highlights {
    margin: 18px 0 0;
    background: var(--accent);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .highlights .hl-title {
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    color: rgba(255,255,255,.65); margin-bottom: 8px;
  }
  .highlights ul { list-style: none; }
  .highlights li {
    position: relative;
    font-size: 14px; color: #fff; line-height: 1.65;
    padding-left: 18px; margin-bottom: 4px;
  }
  .highlights li:last-child { margin-bottom: 0; }
  .highlights li::before {
    content: "";
    position: absolute; left: 2px; top: 9px;
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.55);
  }

  /* 스토리보드 */
  .storyboard { padding: 32px; }
  .sb-label {
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-faint); text-transform: uppercase; margin-bottom: 22px;
  }
  .scene {
    position: relative;
    padding: 0 0 40px 34px;
    border-left: 2px solid var(--line);
    margin-left: 8px;
  }
  .scene:last-child { border-left-color: transparent; padding-bottom: 8px; }
  .scene::before {
    content: "";
    position: absolute; left: -8px; top: 4px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--accent);
  }
  .scene .scene-no {
    font-size: 12px; font-weight: 700; color: var(--accent);
    letter-spacing: .06em; margin-bottom: 4px;
  }
  .scene h3 { font-size: 17.5px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 9px; }
  .scene p { font-size: 15px; color: var(--ink-soft); line-height: 1.85; white-space: pre-line; }
  .scene .quote {
    margin-top: 14px; padding: 13px 17px;
    background: var(--accent-soft); border-radius: 10px;
    font-size: 14px; color: var(--accent); line-height: 1.7;
  }

  /* 숫자 카드 */
  .facts {
    margin-top: 16px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
  }
  .fact {
    background: var(--bg); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 12px 15px;
  }
  .fact b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .fact span { font-size: 12px; color: var(--ink-faint); line-height: 1.45; display: block; margin-top: 2px; }

  /* 플로우 (단계 시각화) */
  .flow {
    margin-top: 16px;
    display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px;
  }
  .flow-step {
    flex: 1 1 0; min-width: 96px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px;
    text-align: center; position: relative;
  }
  .flow-step .fs-num {
    display: inline-grid; place-items: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700; margin-bottom: 6px;
  }
  .flow-step .fs-title { display: block; font-size: 13px; font-weight: 700; line-height: 1.4; }
  .flow-step .fs-sub { display: block; font-size: 11.5px; color: var(--ink-faint); line-height: 1.45; margin-top: 3px; }
  .flow-arrow {
    align-self: center; color: var(--ink-faint);
    font-size: 14px; flex: 0 0 auto; padding: 0 1px;
  }

  /* 체크리스트 */
  .check-list { margin-top: 14px; display: grid; gap: 7px; }
  .check-item {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--bg); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 11px 14px;
    font-size: 14px; color: var(--ink-soft); line-height: 1.6;
  }
  .check-item::before {
    content: "✓";
    flex-shrink: 0;
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 12px; font-weight: 800;
    display: grid; place-items: center;
    margin-top: 2px;
  }
  .check-item b { color: var(--ink); font-weight: 700; }

  /* 미니 테이블 */
  .stable-wrap { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table.stable { width: 100%; border-collapse: collapse; }
  .stable th {
    text-align: left; font-size: 12px; font-weight: 700;
    color: var(--ink-faint); background: #fcfcfa;
    padding: 9px 14px; border-bottom: 1px solid var(--line);
    letter-spacing: .03em; white-space: nowrap;
  }
  .stable td {
    font-size: 13.5px; color: var(--ink-soft);
    padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
    line-height: 1.6; vertical-align: top;
  }
  .stable tr:last-child td { border-bottom: none; }
  .stable td:first-child { font-weight: 600; color: var(--ink); white-space: nowrap; }

  /* Q&A */
  .qna { padding: 6px 32px 46px; }
  .qna-label {
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-faint); text-transform: uppercase;
    margin-bottom: 18px; padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .qa-item { margin-bottom: 24px; }
  .qa-item .q {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 14.5px; font-weight: 600; line-height: 1.65;
    margin-bottom: 9px;
  }
  .qa-item .a {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 14.5px; color: var(--ink-soft); line-height: 1.8;
    white-space: pre-line;
  }
  .qa-mark {
    flex-shrink: 0;
    width: 22px; height: 22px; border-radius: 7px;
    display: grid; place-items: center;
    font-size: 11.5px; font-weight: 800;
    margin-top: 2px;
  }
  .q .qa-mark { background: var(--ink); color: #fff; }
  .a .qa-mark { background: var(--accent-soft); color: var(--accent); }

  .empty-detail {
    padding: 60px 32px; text-align: center; color: var(--ink-faint); font-size: 15px;
  }

  /* ---------- 반응형 ---------- */
  @media (max-width: 760px) {
    .header-inner { padding: 14px 16px; }
    .search-box { min-width: 0; flex: 1; }
    main { padding: 16px 12px 60px; }
    thead { display: none; }
    table:not(.stable), tbody, tr, td { display: block; width: 100%; }
    table.stable, .stable tbody, .stable tr { display: table; }
    table.stable { display: table; }
    .stable tbody { display: table-row-group; }
    .stable tr { display: table-row; }
    .stable td, .stable th { display: table-cell; }
    tbody tr { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
    tbody td { border: none; padding: 2px 0; }
    td.col-no { width: auto; }
    td.col-tags, td.col-links { width: auto; padding-top: 8px; }
    .storyboard, .detail-head, .detail-top { padding-left: 20px; padding-right: 20px; }
    .qna { padding-left: 20px; padding-right: 20px; }
    .detail-modal-wrap { padding: 12px; }
    .detail-panel, .detail-panel.viewer-open { flex-direction: column; width: 100%; }
    .detail-panel.viewer-open .viewer-col { flex: 0 0 60vh; width: 100%; border-left: none; border-top: 1px solid var(--line); }
    .flow { flex-direction: column; }
    .flow-arrow { transform: rotate(90deg); align-self: center; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>ABC 4기 최종 발표 아카이브</h1>
      <p>30명의 발표를 한곳에 정리합니다</p>
    </div>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="이름, 주제, 키워드 검색">
    </div>
  </div>
</header>

<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>NO</th>
          <th>발표자</th>
          <th>발표 주제</th>
          <th>키워드</th>
          <th>자료</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="no-result" id="noResult">검색 결과가 없습니다.</div>
  </div>
</main>

<!-- 상세 패널 -->
<div class="detail-overlay" id="overlay"></div>
<div class="detail-modal-wrap" id="modalWrap">
  <aside class="detail-panel" id="panel" aria-hidden="true">
    <div class="detail-main">
      <div class="detail-top">
        <span class="no" id="dNo"></span>
        <button class="btn-close" id="btnClose" aria-label="닫기">✕</button>
      </div>
      <div class="detail-scroll" id="detailScroll">
        <div class="detail-head">
          <h2 id="dName"></h2>
          <div class="affil" id="dAffil"></div>
          <div class="topic" id="dTopic"></div>
          <div class="detail-links" id="dLinks"></div>
          <div id="dHighlights"></div>
        </div>
        <div id="dBody"></div>
      </div>
    </div>
    <div class="viewer-col" id="viewerCol">
      <div class="viewer-head">
        <span class="vtitle" id="viewerTitle"></span>
        <a class="viewer-newtab" id="viewerOpenNew" href="#" target="_blank" rel="noopener" title="새 탭에서 열기">↗</a>
        <button class="btn-close" id="viewerClose" aria-label="뷰어 닫기">✕</button>
      </div>
      <div class="viewer-body" id="viewerBody"></div>
    </div>
  </aside>
</div>

<script>
/* =========================================================
   발표 데이터
   - 이 배열만 수정하면 사이트 전체가 갱신됩니다.
   - GitHub Pages 배포 시 자료 링크는 저장소 내 상대 경로 사용:
       slides/01.pdf, transcripts/01.html ...
   - 스토리보드 scene에 넣을 수 있는 요소:
       title  : 소제목 (필수)
       text   : 본문
       quote  : 인상적인 발언 (인용 박스)
       facts  : 숫자 카드 [{num, label}]
       flow   : 단계 흐름 [{t: 제목, s: 부연(선택)}]
       list   : 체크리스트 ["<b>제목</b> — 설명", ...]
       table  : 미니 표 {head: [...], rows: [[...], ...]}
   - highlights : 상세 상단 '한눈에 보기' 3~4줄
   - qna        : 질의응답 [{q, a}]
   ========================================================= */
const PRESENTATIONS = [
  {
    no: 1,
    name: "심준만",
    affil: "4기 · 변호사",
    topic: "ProBono 보상 플랫폼 — AI 기반 전문직 재능기부와 보상 매칭·관리 플랫폼",
    summary: "법률서비스 취약계층을 위한 프로보노 활성화 방안. AI 트리아지·매칭에 기업의 간접 보상 구조를 결합한 비영리 공익 플랫폼.",
    tags: ["리걸테크", "프로보노", "AI 매칭", "ESG"],
    links: [
      { label: "발표 슬라이드 (PDF)", url: "slides/01.pdf" },
      { label: "속기록", url: "transcripts/01.html" }
    ],
    highlights: [

        quote: "사람을 줄이는 게 아니라 비용을 줄이고, 남는 시간에 다른 AI 기술을 개발한다 — 그리고 '을'의 부가 서비스를 수익으로 바꾼다."
      },
      {
        title: "마무리 — 멀리 가려면 같이",
        text: "3개년 계획은 'AI를 잘해서 비용을 줄이고 수익을 늘린다'는 것 — AI 시대에 3개년 계획이 의미 없을 수도 있지만 지향점으로 삼는다. 마무리는 아프리카 속담이다 — '빨리 가고 싶으면 혼자 가라. 멀리 가고 싶으면 같이 가라.' 화려하지는 않지만 직원들과 같이 AI에 도전하고 있다.",
        quote: "빨리 가고 싶으면 혼자 갈 수 있지만, 멀리 가고 싶으면 같이 가야 한다 — 화려하지 않지만 직원들과 같이 도전하고 있습니다."
      }
    ],
    qna: [
      {
        q: "캡스톤 10·11·12기 3기 연속 참여인데 — 훈련생을 채용한 경우도 있었나? 3기 연속 참여가 회사 업무에 실제로 도움이 됐다고 느끼나?",
        a: "아직 AI를 본격 도입할 단계가 아니라 채용 실적은 없지만, 채용 시 가점 제도를 만들었고 AI TF를 하면서 대표이사에게 '채용의 문을 열어달라'고 건의하고 있다('채용 안 하시면 벌점'이라는 농담이 돌아왔다). 3기 연속의 효과는 분명하다 — 기술이 쌓이고 동기부여가 됐으며, STO의 경우 실제 사업하는 (모회사 쪽) 대표이사에게 '우리가 이런 걸 하고 있고 캡스톤 학생들이 이런 능력이 있다'고 어필하는 근거가 되고 있다. 심사위원은 'ABC 수강생이 자기 회사 문제를 캡스톤 과제로 내면 의사결정자가 관심을 보여 성과가 확실히 좋고, 연속 참여하면 프로그램도 고도화된다'고 화답했다."
      },
      {
        q: "AI 적용 문제를 발굴할 때 어떤 방식이 효율적이라는 노하우가 생겼나? 그리고 교육을 다시 시킨다면 커리큘럼을 어떻게 바꾸겠나?",
        a: "핵심 노하우는 '업무를 아는 사람에게 AI를 쥐여주는 것'이다 — IT 잘하는 직원이 업무를 모른 채 AI를 적용하는 것보다, 그 업무를 10년 한 직원이 요즘 AI 기술이 뭐가 있는지만 알아도, 사용법만 가볍게 배워도 성과가 굉장히 높아지는 세상이 됐다. 또 실무자와 AI 역량자를 둘씩 붙여 — 실무자는 AI를 배우고 AI 인력은 업무를 배우는 크로스 체크 시너지 조합을 짰다.\n교육은 수준이 천차만별이라(자비로 써본 직원부터 'AI가 뭐야'까지) — 외부 전문 강의를 초청해 수준 높은 교육을 한 번 하고, 눈빛을 보며 수준별로 나눠 교육했다. 신기술은 관심 있는 직원들을 모아 '무엇을 내부 교육할까, 일부는 외부 교육 사업으로 어떻게 확장할까'를 고민 중이다."
      },
      {
        q: "(조언) 가장 AI스러운 사업 모델이다 — 채권 평가를 AI와 함께 학부 졸업생에게 시켰을 때 박사 인력과 얼마나 차이가 나는지 확인해 보면 '박사의 가치'도 알 수 있을 것이다. 그리고 자산군별로 어떤 데이터가 중요한 인풋인지 갈라낼 수 있으면 — 평균 가격으로 팔던 데이터에 차별 가격을 시도할 수 있고, 데이터로부터 회사의 바게닝 파워가 생긴다.",
        a: "심사위원의 전략 조언 — ① 인력 구성 실험: AI 보조 하에서 학위별 성과 격차를 측정하면 인건비 구조와 박사 인력의 가치에 대한 통찰을 얻을 수 있다(스스로 '잔인한 이야기'라고 덧붙였다). ② 데이터 가격 차별화: 한국형 부동산 가치 평가에 상대적으로 중요한 인풋을 식별해내면, 데이터 벤더들이 가치 증명을 못 해 평균 가격에 팔던 관행을 깨고 자산 특화 데이터의 차별 가격 체계를 만들 수 있으며 — 단순 부가 서비스를 넘어 데이터 자체의 협상력이 생긴다는 제언이었다."
      }
    ]
  }
];

// 아직 채워지지 않은 발표자 자리 (2번~30번)
for (let i = PRESENTATIONS.length + 1; i <= 30; i++) {
  PRESENTATIONS.push({
    no: i,
    name: "미정",
    affil: "",
    topic: "",
    summary: "",
    tags: [],
    links: [],
    highlights: [],
    scenes: [],
    qna: [],
    placeholder: true
  });
}

/* ---------- 표 렌더링 ---------- */
const tbody = document.getElementById("tbody");
const noResult = document.getElementById("noResult");

const LINK_ICON = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 18.5"/></svg>`;

function renderTable(list) {
  tbody.innerHTML = list.map(p => {
    if (p.placeholder) {
      return `
        <tr class="empty" data-no="${p.no}">
          <td class="col-no">${String(p.no).padStart(2, "0")}</td>
          <td class="col-name">미정</td>
          <td class="col-topic"><span class="badge-pending">등록 대기</span></td>
          <td class="col-tags"></td>
          <td class="col-links"></td>
        </tr>`;
    }
    return `
      <tr data-no="${p.no}">
        <td class="col-no">${String(p.no).padStart(2, "0")}</td>
        <td class="col-name">${p.name}${p.affil ? `<span class="sub">${p.affil}</span>` : ""}</td>
        <td class="col-topic">
          <span class="t">${p.topic}</span>
          ${p.summary ? `<span class="summary">${p.summary}</span>` : ""}
        </td>
        <td class="col-tags"><div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div></td>
        <td class="col-links">${p.links.map(l => `
          <a class="mini-link" href="${l.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${LINK_ICON}${l.label.replace(" (PDF)", "")}</a>`).join("")}
        </td>
      </tr>`;
  }).join("");
  noResult.style.display = list.length ? "none" : "block";
}

/* ---------- 검색 ---------- */
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) return renderTable(PRESENTATIONS);
  renderTable(PRESENTATIONS.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.topic.toLowerCase().includes(q) ||
    (p.summary || "").toLowerCase().includes(q) ||
    p.tags.some(t => t.toLowerCase().includes(q))
  ));
});

/* ---------- 상세 패널 ---------- */
const overlay = document.getElementById("overlay");
const modalWrap = document.getElementById("modalWrap");
const panel = document.getElementById("panel");
const detailScroll = document.getElementById("detailScroll");

function renderScene(s, i) {
  let inner = `
    <div class="scene-no">SCENE ${i + 1}</div>
    <h3>${s.title}</h3>
    ${s.text ? `<p>${s.text}</p>` : ""}`;

  if (s.flow) {
    inner += `<div class="flow">${s.flow.map((f, idx) => `
      ${idx > 0 ? `<span class="flow-arrow">→</span>` : ""}
      <div class="flow-step">
        <span class="fs-num">${idx + 1}</span>
        <span class="fs-title">${f.t}</span>
        ${f.s ? `<span class="fs-sub">${f.s}</span>` : ""}
      </div>`).join("")}
    </div>`;
  }
  if (s.facts) {
    inner += `<div class="facts">${s.facts.map(f => `<div class="fact"><b>${f.num}</b><span>${f.label}</span></div>`).join("")}</div>`;
  }
  if (s.list) {
    inner += `<div class="check-list">${s.list.map(item => `<div class="check-item"><span>${item}</span></div>`).join("")}</div>`;
  }
  if (s.table) {
    inner += `
      <div class="stable-wrap"><table class="stable">
        <thead><tr>${s.table.head.map(h => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${s.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>`;
  }
  if (s.quote) {
    inner += `<div class="quote">“${s.quote}”</div>`;
  }
  return `<div class="scene">${inner}</div>`;
}

function openDetail(no) {
  const p = PRESENTATIONS.find(x => x.no === no);
  if (!p) return;

  document.getElementById("dNo").textContent = `NO. ${String(p.no).padStart(2, "0")}`;
  document.getElementById("dName").textContent = p.name;
  document.getElementById("dAffil").textContent = p.affil || "";
  document.getElementById("dTopic").textContent = p.topic;

  document.getElementById("dLinks").innerHTML = p.links.map(l => {
    const isPdf = /\.pdf(\?|#|$)/i.test(l.url);
    return `<button class="link-pill" data-url="${l.url}" data-label="${l.label}" data-pdf="${isPdf}">${LINK_ICON}${l.label}</button>`;
  }).join("");

  document.getElementById("dHighlights").innerHTML = (p.highlights && p.highlights.length) ? `
    <div class="highlights">
      <div class="hl-title">한눈에 보기</div>
      <ul>${p.highlights.map(h => `<li>${h}</li>`).join("")}</ul>
    </div>` : "";

  const body = document.getElementById("dBody");
  let html = "";

  if (p.scenes && p.scenes.length) {
    html += `
      <div class="storyboard">
        <div class="sb-label">Storyboard</div>
        ${p.scenes.map(renderScene).join("")}
      </div>`;
  }

  if (p.qna && p.qna.length) {
    html += `
      <div class="qna">
        <div class="qna-label">Q&amp;A — 질의응답</div>
        ${p.qna.map(item => `
          <div class="qa-item">
            <div class="q"><span class="qa-mark">Q</span><span>${item.q}</span></div>
            <div class="a"><span class="qa-mark">A</span><span>${item.a}</span></div>
          </div>
        `).join("")}
      </div>`;
  }

  if (!html) html = `<div class="empty-detail">아직 정리된 발표 내용이 없습니다.</div>`;
  body.innerHTML = html;

  closeViewer();
  detailScroll.scrollTop = 0;
  overlay.classList.add("open");
  modalWrap.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeDetail() {
  closeViewer();
  overlay.classList.remove("open");
  modalWrap.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

/* ---------- 옆에 열리는 뷰어 (토글) ---------- */
let currentViewer = null;

function toggleViewer(url, label, isPdf) {
  if (currentViewer === url) { closeViewer(); return; }
  currentViewer = url;
  document.getElementById("viewerTitle").textContent = label;
  document.getElementById("viewerOpenNew").href = url;
  document.getElementById("viewerBody").innerHTML = isPdf
    ? `<object data="${url}#toolbar=1&view=FitH" type="application/pdf"><iframe src="${url}" title="${label}"></iframe></object>`
    : `<iframe src="${url}" title="${label}"></iframe>`;
  panel.classList.add("viewer-open");
  document.querySelectorAll("#dLinks .link-pill").forEach(b =>
    b.classList.toggle("active", b.dataset.url === url));
}

function closeViewer() {
  currentViewer = null;
  panel.classList.remove("viewer-open");
  document.getElementById("viewerBody").innerHTML = "";
  document.querySelectorAll("#dLinks .link-pill").forEach(b => b.classList.remove("active"));
}

tbody.addEventListener("click", e => {
  const row = e.target.closest("tr");
  if (row) openDetail(Number(row.dataset.no));
});
document.getElementById("dLinks").addEventListener("click", e => {
  const btn = e.target.closest(".link-pill");
  if (!btn) return;
  toggleViewer(btn.dataset.url, btn.dataset.label, btn.dataset.pdf === "true");
});
document.getElementById("viewerClose").addEventListener("click", closeViewer);
overlay.addEventListener("click", closeDetail);
document.getElementById("btnClose").addEventListener("click", closeDetail);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

renderTable(PRESENTATIONS);
</script>
</body>
</html>
