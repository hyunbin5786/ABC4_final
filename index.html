<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC 최종 발표 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f7f7f5; --surface: #fff; --ink: #1a1a1a; --ink-soft: #55554f;
    --ink-faint: #8f8f86; --line: #e6e6e0; --accent: #2f5d50; --accent-soft: #e8f0ed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .wrap { max-width: 780px; width: 100%; text-align: center; }
  .label { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--accent); margin-bottom: 12px; }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
  .sub { font-size: 15px; color: var(--ink-faint); margin-bottom: 44px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; text-align: left; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 30px 30px 26px; display: block; text-decoration: none; color: var(--ink);
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,.07); }
  .card .gi { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--accent); margin-bottom: 6px; }
  .card h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; }
  .card .desc { font-size: 13.5px; color: var(--ink-faint); margin-bottom: 18px; }
  .card .go {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: #fff;
    background: var(--accent); border-radius: 999px; padding: 8px 16px;
  }
  .card .alt { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 12px; }
  .card .alt:hover { color: var(--accent); }
  @media (max-width: 620px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">SNU BIG DATA AI CEO</div>
  <h1>ABC 최종 발표 아카이브</h1>
  <p class="sub">기수를 선택하면 우수 프로젝트를 먼저 만나고, 전체 아카이브로 이어집니다.</p>
  <div class="cards">
    <a class="card" href="best3.html">
      <div class="gi">ABC 3기</div>
      <h2>우수 프로젝트 14선</h2>
      <div class="desc">발표 25편 · 우수상 14편 · 2026년 상반기</div>
      <span class="go">쉽게 읽기로 시작 →</span>
      <span class="alt" onclick="event.preventDefault(); location.href='archive3.html'">전체 아카이브 바로 가기 ↗</span>
    </a>
    <a class="card" href="best4.html">
      <div class="gi">ABC 4기</div>
      <h2>우수 프로젝트 15선</h2>
      <div class="desc">발표 30편 · 우수상 12편 포함 15선 · 2026년 여름</div>
      <span class="go">쉽게 읽기로 시작 →</span>
      <span class="alt" onclick="event.preventDefault(); location.href='archive.html'">전체 아카이브 바로 가기 ↗</span>
    </a>
  </div>
</div>
</body>
</html>
